[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "africa-pulse"
version = "0.1.0"
description = "Traceable urban intelligence platform for Lagos, Abuja, and Cape Town"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect>=0.8,<0.9",
  "httpx>=0.27,<0.29",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.8,<1.0"]
presentation = ["python-pptx>=1.0,<2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.package-data]
africa_pulse = ["*.html"]
